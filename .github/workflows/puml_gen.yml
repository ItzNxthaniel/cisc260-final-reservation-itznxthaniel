name: Generate PlantUML Diagrams

on:
  push:
    branches: ["main"]
    paths: ["**.puml"]

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: PlantUML GitHub Action
        uses: rotaract/plantuml-action@v1.3.0
        with:
          format: png
          pattern: "diagrams/src/**.puml"

      - name: "Move generated PNGs to out directory."
        run | 
          mkdir -p diagrams/out
          cd diagrams/src
          find . -name "*.png" -exec cp --parents {} ../out/ \;

      - name: Upload Diagrams
        uses: actions/upload-artifact@v4
        with:
          name: diagrams
          path: "diagrams/out/**.png"