name: Generate PlantUML Diagrams

on:
  push:
    branches: ["main"]
    # paths: ["**.puml"]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: PlantUML GitHub Action
        uses: rotaract/plantuml-action@v1.3.0
        with:
          format: png
          pattern: "diagrams/src/**/**.puml"

      - name: "Move generated PNGs to out directory."
        run: | 
          mkdir -p diagrams/out
          cd diagrams/src
          find . -name "*.png" -exec cp --parents {} ../out/ \;

          find . -name "*png" -delete

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add diagrams/out/

          git diff --staged --quiet || git commit -m "chore: auto-generate PlantUML diagrams"
          git push