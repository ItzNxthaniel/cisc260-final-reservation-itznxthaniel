name: Generate PlantUML Diagrams

on:
  push:
    branches: ["main"]
    # paths: ["**.puml"]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz and Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz fonts-liberation

      - name: Download Latest PlantUML
        run: curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render Diagrams
        run: java -jar plantuml.jar -tpng "diagrams/src/**.puml"

      - name: Move generated PNGs to diagrams/out
        run: | 
          mkdir -p diagrams/out
          cd diagrams/src

          find . -name "*.png" -exec cp --parents {} ../out/ \;
          find . -name "*png" -delete 

      - name: Commit and Push to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add diagrams/out/

          git diff --staged --quiet || git commit -m "chore: auto-generate PlantUML diagrams"
          git push